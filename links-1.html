<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ссылки на уроки</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    max-width: 700px;
    margin: 0 auto;
    background: white;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 24px;
  }
  h1 {
    font-size: 22px;
    color: #333;
    margin-bottom: 4px;
  }
  p.sub {
    color: #777;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .group {
    margin-bottom: 22px;
  }
  .group h2 {
    font-size: 16px;
    color: #667eea;
    margin-bottom: 10px;
    border-bottom: 2px solid #eee;
    padding-bottom: 6px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-radius: 10px;
    background: #f8f9fa;
    margin-bottom: 8px;
    transition: background 0.2s;
  }
  .row:active {
    background: #e8e8f5;
  }
  .row span {
    font-size: 15px;
    color: #333;
    font-weight: 600;
  }
  .copy-btn {
    border: none;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    min-width: 74px;
  }
  .copy-btn.copied {
    background: #2ecc71;
  }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #333;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    opacity: 0;
    transition: all 0.25s;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div class="container">
  <h1>Ссылки на уроки</h1>
  <p class="sub">Нажми на кнопку "Копировать" рядом с нужным уроком — ссылка сама скопируется, дальше просто вставь её в чат.</p>
  <div id="content"></div>
</div>

<div class="toast" id="toast">Скопировано!</div>

<script>
const base = "https://llimbol.github.io/LIMBO/";

const groups = {
  "Beginner": Array.from({length:10}, (_,i)=>`Beginner U${i+1}.html`),
  "Elementary": Array.from({length:12}, (_,i)=>`Elementary U${i+1}.html`),
  "Pre-Intermediate": Array.from({length:12}, (_,i)=>`Pre-Intermediate U${i+1}.html`),
  "Intermediate": Array.from({length:12}, (_,i)=>`Intermediate U${i+1}.html`),
  "Upper-Intermediate": [
    "Upper-Intermediate U1.html",
    "Upper-Intermediate U2.html",
    "Upper-Intermediate U3.html",
    "Upper-Intermediate U4.html",
    "Upper-Intermediate_U5.html",
    "Upper-Intermediate_U6.html",
    "Upper-Intermediate_U7.html",
    "Upper-Intermediate_U8.html",
    "Upper-Intermediate_U9.html",
    "Upper-Intermediate_U10.html",
    "Upper-Intermediate_U11.html",
    "Upper-Intermediate_U12.html",
  ]
};

const content = document.getElementById('content');
const toast = document.getElementById('toast');

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=> toast.classList.remove('show'), 1400);
}

function copyText(text, btn){
  const done = () => {
    const original = btn.textContent;
    btn.textContent = "✓ Готово";
    btn.classList.add('copied');
    showToast("Ссылка скопирована");
    setTimeout(()=>{
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 1300);
  };

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(()=> fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand('copy'); done(); } catch(e) { showToast("Не удалось скопировать"); }
  document.body.removeChild(ta);
}

Object.entries(groups).forEach(([groupName, files]) => {
  const groupDiv = document.createElement('div');
  groupDiv.className = 'group';
  const h2 = document.createElement('h2');
  h2.textContent = groupName;
  groupDiv.appendChild(h2);

  files.forEach((filename, idx) => {
    const url = base + encodeURIComponent(filename).replace(/%2F/g, '/');
    const row = document.createElement('div');
    row.className = 'row';

    const span = document.createElement('span');
    span.textContent = `${groupName} U${idx+1}`;
    row.appendChild(span);

    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'Копировать';
    btn.addEventListener('click', () => copyText(url, btn));
    row.appendChild(btn);

    groupDiv.appendChild(row);
  });

  content.appendChild(groupDiv);
});
</script>
</body>
</html>
